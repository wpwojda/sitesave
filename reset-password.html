<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Sitesave</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .reset-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .reset-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px 28px;
    width: 100%; max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,.08);
  }
  .reset-logo {
    font-size: 18px; font-weight: 600; letter-spacing: -.03em;
    color: var(--text); margin-bottom: 4px;
  }
  .reset-title {
    font-size: 15px; color: var(--text2);
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="reset-wrap">
  <div class="reset-card">
    <div class="reset-logo">Sitesave</div>
    <div class="reset-title">Set a new password</div>

    <div id="reset-form">
      <div class="auth-field">
        <label class="auth-label">New password</label>
        <input class="auth-input" id="new-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label class="auth-label">Confirm new password</label>
        <input class="auth-input" id="new-password2" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="auth-error hidden" id="reset-error"></div>
      <button class="auth-submit" id="reset-submit" onclick="updatePassword()">Set new password</button>
    </div>

    <div id="reset-success" class="hidden">
      <p class="auth-body">Your password has been updated. You can now sign in with your new password.</p>
      <a class="auth-submit" href="/" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">Go to Sitesave</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://rrosyexsujynvykdjrlp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb3N5ZXhzdWp5bnZ5a2RqcmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzkwNjAsImV4cCI6MjA5NTA1NTA2MH0.9oo-WeyULtRPCMmrfm0VJrl9e_OQh9cJlIkfA_bSiFI';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: {
    storage: window.localStorage,
    storageKey: 'sitesave-auth',
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true,
  }
});

// Apply saved theme
(function() {
  const saved = localStorage.getItem('sitesave-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = 'dark';
})();

async function updatePassword() {
  const password = document.getElementById('new-password').value;
  const password2 = document.getElementById('new-password2').value;
  const errorEl = document.getElementById('reset-error');
  const btn = document.getElementById('reset-submit');

  errorEl.classList.add('hidden');
  errorEl.textContent = '';

  if (!password || !password2) {
    errorEl.textContent = 'Please fill in both fields.';
    errorEl.classList.remove('hidden');
    return;
  }
  if (password.length < 8) {
    errorEl.textContent = 'Password must be at least 8 characters.';
    errorEl.classList.remove('hidden');
    return;
  }
  if (password !== password2) {
    errorEl.textContent = 'Passwords do not match.';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.style.opacity = '.6';

  const { error } = await sb.auth.updateUser({ password });

  btn.disabled = false;
  btn.style.opacity = '';

  if (error) {
    errorEl.textContent = error.message;
    errorEl.classList.remove('hidden');
    return;
  }

  document.getElementById('reset-form').classList.add('hidden');
  document.getElementById('reset-success').classList.remove('hidden');
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') updatePassword();
});
</script>
</body>
</html>
