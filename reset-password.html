<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Sitesave</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .reset-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .reset-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px 28px;
    width: 100%; max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,.08);
  }
  .reset-logo {
    font-size: 18px; font-weight: 600; letter-spacing: -.03em;
    color: var(--text); margin-bottom: 4px;
  }
  .reset-title {
    font-size: 15px; color: var(--text2);
    margin-bottom: 24px;
  }
  /* Loading state */
  .reset-loading {
    text-align: center; padding: 20px 0;
    color: var(--text2); font-size: 14px;
  }
  .reset-loading-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--text3);
    margin: 0 2px; animation: resetBounce 1s ease-in-out infinite;
  }
  .reset-loading-dot:nth-child(2) { animation-delay: .15s; }
  .reset-loading-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes resetBounce {
    0%, 80%, 100% { transform: scale(.6); opacity: .4; }
    40% { transform: scale(1); opacity: 1; }
  }
  /* Expired / invalid link state */
  .reset-expired {
    text-align: center; padding: 8px 0;
  }
  .reset-expired-icon {
    font-size: 32px; margin-bottom: 12px;
  }
  .reset-expired p {
    font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5;
  }
</style>
</head>
<body>

<div class="reset-wrap">
  <div class="reset-card">
    <div class="reset-logo">Sitesave</div>
    <div class="reset-title" id="reset-subtitle">Verifying reset link…</div>

    <!-- Loading state while we wait for session -->
    <div id="reset-loading" class="reset-loading">
      <span class="reset-loading-dot"></span>
      <span class="reset-loading-dot"></span>
      <span class="reset-loading-dot"></span>
    </div>

    <!-- Expired / invalid link -->
    <div id="reset-expired" class="reset-expired hidden">
      <div class="reset-expired-icon">🔗</div>
      <p>This password reset link has expired or has already been used. Reset links are valid for one hour.</p>
      <a class="auth-submit" href="/?forgot=1" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">Request a new link</a>
    </div>

    <!-- The actual form — shown only after session confirmed -->
    <div id="reset-form" class="hidden">
      <div class="auth-field">
        <label class="auth-label">New password</label>
        <div class="auth-input-wrap">
          <input class="auth-input" id="new-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkResetStrength()">
          <button class="auth-eye" type="button" onclick="toggleResetVisibility('new-password', this)" tabindex="-1" aria-label="Show password">
            <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-hide hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="auth-strength" id="reset-strength"></div>
      </div>
      <div class="auth-field">
        <label class="auth-label">Confirm new password</label>
        <div class="auth-input-wrap">
          <input class="auth-input" id="new-password2" type="password" placeholder="••••••••" autocomplete="new-password" oninput="checkResetMatch()">
          <button class="auth-eye" type="button" onclick="toggleResetVisibility('new-password2', this)" tabindex="-1" aria-label="Show password">
            <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-hide hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="auth-match" id="reset-match"></div>
      </div>
      <div class="auth-error hidden" id="reset-error"></div>
      <button class="auth-submit" id="reset-submit" onclick="updatePassword()">Set new password</button>
    </div>

    <div id="reset-success" class="hidden">
      <p class="auth-body" style="font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:20px;">Your password has been updated. You can now sign in with your new password.</p>
      <a class="auth-submit" href="/" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">Go to Sitesave</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://rrosyexsujynvykdjrlp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb3N5ZXhzdWp5bnZ5a2RqcmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzkwNjAsImV4cCI6MjA5NTA1NTA2MH0.9oo-WeyULtRPCMmrfm0VJrl9e_OQh9cJlIkfA_bSiFI';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: {
    storage: window.localStorage,
    storageKey: 'sitesave-auth',
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true,
  }
});

// Apply saved theme
(function() {
  const saved = localStorage.getItem('sitesave-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = 'dark';
})();

// ── WAIT FOR PASSWORD_RECOVERY SESSION ───────────────────────
// Supabase exchanges the code from the reset URL automatically when
// detectSessionInUrl is true. We just need to wait for the event.
let sessionReady = false;

// Timeout — if no PASSWORD_RECOVERY fires within 8s, treat link as expired/invalid
const expiredTimer = setTimeout(() => {
  if (!sessionReady) showExpired();
}, 8000);

sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    clearTimeout(expiredTimer);
    sessionReady = true;
    showForm();
  } else if (event === 'SIGNED_IN' && session) {
    // Some Supabase versions fire SIGNED_IN instead of PASSWORD_RECOVERY for reset flows
    // Only treat as recovery if we came from a reset link (hash/code in URL)
    const url = window.location.href;
    if ((url.includes('type=recovery') || url.includes('access_token') || url.includes('code=')) && !sessionReady) {
      clearTimeout(expiredTimer);
      sessionReady = true;
      showForm();
    }
  }
});

function showForm() {
  document.getElementById('reset-loading').classList.add('hidden');
  document.getElementById('reset-expired').classList.add('hidden');
  document.getElementById('reset-subtitle').textContent = 'Set a new password';
  document.getElementById('reset-form').classList.remove('hidden');
  setTimeout(() => document.getElementById('new-password').focus(), 50);
}

function showExpired() {
  document.getElementById('reset-loading').classList.add('hidden');
  document.getElementById('reset-subtitle').textContent = 'Link expired';
  document.getElementById('reset-expired').classList.remove('hidden');
}

// ── PASSWORD UI ───────────────────────────────────────────────
function toggleResetVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  btn.querySelector('.eye-show').classList.toggle('hidden', isPassword);
  btn.querySelector('.eye-hide').classList.toggle('hidden', !isPassword);
}

function checkResetStrength() {
  const el = document.getElementById('reset-strength');
  const value = document.getElementById('new-password').value;
  if (!value) { el.textContent = ''; el.className = 'auth-strength'; return; }
  let strength = 0;
  if (value.length >= 8) strength++;
  if (value.length >= 12) strength++;
  if (/[A-Z]/.test(value) && /[a-z]/.test(value)) strength++;
  if (/[0-9]/.test(value)) strength++;
  if (/[^A-Za-z0-9]/.test(value)) strength++;
  if (strength <= 1) { el.textContent = 'Weak password'; el.className = 'auth-strength weak'; }
  else if (strength <= 3) { el.textContent = 'Good password'; el.className = 'auth-strength good'; }
  else { el.textContent = 'Strong password'; el.className = 'auth-strength strong'; }
  // Also refresh match if confirm field has a value
  if (document.getElementById('new-password2').value) checkResetMatch();
}

function checkResetMatch() {
  const el = document.getElementById('reset-match');
  const p1 = document.getElementById('new-password').value;
  const p2 = document.getElementById('new-password2').value;
  if (!p2) { el.textContent = ''; el.className = 'auth-match'; return; }
  if (p1 === p2) { el.textContent = 'Passwords match'; el.className = 'auth-match match'; }
  else { el.textContent = 'Passwords do not match'; el.className = 'auth-match no-match'; }
}

// ── UPDATE PASSWORD ───────────────────────────────────────────
async function updatePassword() {
  const password = document.getElementById('new-password').value;
  const password2 = document.getElementById('new-password2').value;
  const errorEl = document.getElementById('reset-error');
  const btn = document.getElementById('reset-submit');

  errorEl.classList.add('hidden');
  errorEl.textContent = '';

  if (!password || !password2) {
    errorEl.textContent = 'Please fill in both fields.';
    errorEl.classList.remove('hidden');
    return;
  }
  if (password.length < 8) {
    errorEl.textContent = 'Password must be at least 8 characters.';
    errorEl.classList.remove('hidden');
    return;
  }
  if (password !== password2) {
    errorEl.textContent = 'Passwords do not match.';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await sb.auth.updateUser({ password });

  btn.disabled = false;
  btn.textContent = 'Set new password';

  if (error) {
    errorEl.textContent = error.message;
    errorEl.classList.remove('hidden');
    return;
  }

  document.getElementById('reset-form').classList.add('hidden');
  document.getElementById('reset-subtitle').textContent = 'Password updated';
  document.getElementById('reset-success').classList.remove('hidden');
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && sessionReady) updatePassword();
});
</script>
</body>
</html>
