<script>

// ── THEME ─────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'light' ? 'dark' : 'light';
  html.dataset.theme = next;
  localStorage.setItem('sitesave-theme', next);
}
(function () {
  const saved = localStorage.getItem('sitesave-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = 'dark';
})();

// ── SUPABASE ──────────────────────────────────────────────────
const SUPA_URL = 'https://rrosyexsujynvykdjrlp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb3N5ZXhzdWp5bnZ5a2RqcmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzkwNjAsImV4cCI6MjA5NTA1NTA2MH0.9oo-WeyULtRPCMmrfm0VJrl9e_OQh9cJlIkfA_bSiFI';
// Primary client — checks if visitor is logged in, using same storage key as main app
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {

// Anon client for reading shared collection data (no auth bleed)
const sbAnon = supabase.createClient(SUPA_URL, SUPA_KEY, {

    detectSessionInUrl: false,
  }
});

let CURRENT_USER = null;

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  CURRENT_USER = session?.user || null;
  renderCTA();
}

function renderCTA() {
  const cta = document.getElementById('share-cta');
  if (!cta) return;
  if (CURRENT_USER) {
    cta.innerHTML = `
      <p class="share-cta-text">Add to your library</p>
      <p class="share-cta-sub">Import all bookmarks from this collection into your Sitesave library.</p>
      <button class="btn-add share-cta-btn" onclick="importCollection()">Add to my library</button>
    `;
  } else {
    cta.innerHTML = `
      <p class="share-cta-text">Like what you see?</p>
      <p class="share-cta-sub">Save your own references and organise them into collections.</p>
      <a class="btn-add share-cta-btn" href="https://sitesave.co.uk/">Start saving</a>
    `;
  }
}

async function importCollection() {
  if (!CURRENT_USER) return;
  const btn = document.querySelector('.share-cta-btn');
  if (btn) { btn.textContent = 'Importing…'; btn.disabled = true; }

  try {
    // Get collection name for the new collection
    const collectionName = document.getElementById('share-title')?.textContent?.trim() || 'Imported collection';

    // Fetch user's existing URLs to detect duplicates
    const { data: existing } = await sb.from('bookmarks').select('url').eq('user_id', CURRENT_USER.id);
    const existingUrls = new Set((existing || []).map(b => b.url));

    // Filter out duplicates
    const toImport = BM.filter(b => !existingUrls.has(b.url));
    const skipped = BM.length - toImport.length;

    if (toImport.length === 0) {
      if (btn) { btn.textContent = 'Already in your library'; btn.disabled = false; }
      return;
    }

    // Create a new collection
    const { data: col, error: colErr } = await sb.from('collections')
      .insert({ name: collectionName, user_id: CURRENT_USER.id })
      .select().single();
    if (colErr) throw colErr;

    // Insert bookmarks
    const rows = toImport.map(b => ({
      url:     b.url,
      name:    b.name,
      tags:    b.tags || [],
      user_id: CURRENT_USER.id,
      fav:     false,
    }));
    const { data: inserted, error: bmErr } = await sb.from('bookmarks').insert(rows).select('id');
    if (bmErr) throw bmErr;

    // Link bookmarks to the new collection
    const links = inserted.map(r => ({ bookmark_id: r.id, collection_id: col.id }));
    await sb.from('bookmark_collections').insert(links);

    const msg = skipped > 0
      ? `Imported ${toImport.length} bookmarks (${skipped} duplicate${skipped > 1 ? 's' : ''} skipped)`
      : `Imported ${toImport.length} bookmarks`;

    const cta = document.getElementById('share-cta');
    cta.innerHTML = `
      <p class="share-cta-text">Done!</p>
      <p class="share-cta-sub">${msg}. Find them in your library under "${collectionName}".</p>
      <a class="btn-add share-cta-btn" href="https://sitesave.co.uk/">Go to my library</a>
    `;
  } catch (e) {
    console.error('Import failed:', e);
    if (btn) { btn.textContent = 'Import failed — try again'; btn.disabled = false; }
  }
}

function host(u) { try { return new URL(u).hostname.replace('www.', ''); } catch { return u; } }
function x(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let BM = [];
let activeTag = null;
let gridCols = parseInt(localStorage.getItem('sitesave-share-cols') || '2');

function setGridCols(n) {
  gridCols = n;
  localStorage.setItem('sitesave-share-cols', n);
  if (window.innerWidth > 640) {
    document.getElementById('share-grid').style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  }
  document.querySelectorAll('.grid-btn').forEach(b => {
    b.classList.toggle('on', parseInt(b.dataset.cols) === n);
  });
}

window.addEventListener('resize', () => {
  const grid = document.getElementById('share-grid');
  if (!grid) return;
  if (window.innerWidth <= 640) {
    grid.style.gridTemplateColumns = '';
  } else {
    grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  }
});

function renderPills() {
  const allTags = [...new Set(BM.flatMap(b => b.tags || []))].sort();
  const untaggedCount = BM.filter(b => !(b.tags || []).length).length;
  const pillsEl = document.getElementById('share-pills');
  if (!pillsEl) return;
  const pills = [
    `<div class="pill ${!activeTag ? 'on' : ''}" onclick="setTagFilter(null)">All</div>`,
    ...allTags.map(t => `<div class="pill ${activeTag === t ? 'on' : ''}" onclick="setTagFilter('${x(t)}')">${x(t)}</div>`),
    ...(untaggedCount > 0 ? [`<div class="pill ${activeTag === 'untagged' ? 'on' : ''}" onclick="setTagFilter('untagged')">Untagged</div>`] : [])
  ];
  pillsEl.innerHTML = pills.join('');
}

function setTagFilter(tag) {
  activeTag = tag;
  renderPills();
  renderCards();
}

function setTagFilter(tag) {
  activeTag = tag;
  renderPills();
  renderCards();
}

// ── LOAD SHARED COLLECTION ────────────────────────────────────
async function init() {
  const token = new URLSearchParams(location.search).get('c');
  if (!token) { showError(); return; }

  // Fetch collection by share token
  const { data: col, error: colErr } = await sbAnon
    .from('collections')
    .select('id, name')
    .eq('share_token', token)
    .single();

  if (colErr || !col) { showError(); return; }

  // Fetch bookmark ids in this collection
  const { data: bcData, error: bcErr } = await sbAnon
    .from('bookmark_collections')
    .select('bookmark_id')
    .eq('collection_id', col.id);

  if (bcErr || !bcData?.length) {
    showMeta(col.name, 0);
    return;
  }

  const ids = bcData.map(r => r.bookmark_id);

  // Fetch the bookmarks
  const { data: bmData, error: bmErr } = await sbAnon
    .from('bookmarks')
    .select('id, url, name, tags, color, fav, created_at')
    .in('id', ids);

  if (bmErr) { showError(); return; }

  BM = (bmData || []).map(row => {
    let tags = row.tags;
    if (typeof tags === 'string') { try { tags = JSON.parse(tags); } catch { tags = []; } }
    return { id: row.id, url: row.url, name: row.name, tags: Array.isArray(tags) ? tags : [], color: row.color || '#111110', fav: row.fav || false, date: new Date(row.created_at).getTime() };
  }).sort((a, b) => b.date - a.date);

  showMeta(col.name, BM.length);
  renderPills();
  renderCards();
}

function showMeta(name, count) {
  document.title = `${name} — Sitesave`;
  document.querySelector('meta[property="og:title"]').setAttribute('content', `${name} — Sitesave`);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${name} — Sitesave`);
  document.getElementById('share-title').textContent = name;
  document.getElementById('share-count').textContent = `${count} site${count !== 1 ? 's' : ''}`;
  document.getElementById('share-meta').style.display = '';
}

function showError() {
  document.getElementById('share-error').style.display = 'flex';
}

// ── RENDER CARDS ──────────────────────────────────────────────
function renderCards() {
  const g = document.getElementById('share-grid');
  const list = activeTag === 'untagged'
    ? BM.filter(b => !(b.tags || []).length)
    : activeTag
      ? BM.filter(b => (b.tags || []).map(t => t.toLowerCase()).includes(activeTag.toLowerCase()))
      : BM;

  if (window.innerWidth > 640) {
    g.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  }
  document.querySelectorAll('.grid-btn').forEach(b => {
    b.classList.toggle('on', parseInt(b.dataset.cols) === gridCols);
  });

  g.innerHTML = list.map((b, i) => {
    const h = host(b.url);
    return `
<div class="card" style="animation-delay:${i * .03}s" onclick="openPreview('${b.id}')">
  <div class="card-thumb" id="thumb-${b.id}">
    <div class="thumb-shimmer" id="shimmer-${b.id}"></div>
    <img id="shot-${b.id}" alt="${x(b.name)} preview">
    <div class="thumb-error" id="err-${b.id}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>Preview unavailable</span>
    </div>
  </div>
  <div class="card-foot">
    <div class="foot-top">
      <div class="foot-favicon">
        <img src="https://www.google.com/s2/favicons?domain=${h}&sz=32" onerror="this.style.display='none'" loading="lazy">
      </div>
      <span class="foot-name">${x(b.name)}</span>
    </div>
  </div>
</div>`;
  }).join('');

  list.forEach(b => loadScreenshot(b.id, b.url));
}

function loadScreenshot(id, url) {
  const img     = document.getElementById('shot-' + id);
  const shimmer = document.getElementById('shimmer-' + id);
  const errEl   = document.getElementById('err-' + id);
  if (!img) return;
  img.onload  = () => { if (shimmer) shimmer.style.display = 'none'; img.classList.add('loaded'); };
  img.onerror = () => { if (shimmer) shimmer.style.display = 'none'; if (errEl) errEl.style.display = 'flex'; };
  img.src = `https://sitesave-screenshots.wpwojda.workers.dev/?url=${encodeURIComponent(url)}`;
}

// ── PREVIEW MODAL ─────────────────────────────────────────────
function openPreview(id) {
  const b = BM.find(b => b.id == id);
  if (!b) return;
  const h = host(b.url);
  document.getElementById('preview-title').textContent = b.name;
  document.getElementById('preview-url').textContent   = b.url;
  document.getElementById('preview-ext-link').href     = b.url;
  document.getElementById('preview-fav-img').src       = `https://www.google.com/s2/favicons?domain=${h}&sz=32`;
  document.getElementById('preview-loading').style.display = 'none';
  document.getElementById('preview-iframe').style.display  = 'none';
  document.getElementById('preview-ov').classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  const ss = document.getElementById('preview-screenshot');
  ss.style.display = 'flex';
  const msgEl = document.getElementById('preview-blocked-msg');
  if (msgEl) msgEl.classList.add('hidden');

  const img = ss.querySelector('img');
  if (img) {
    img.removeAttribute('src');
    img.style.display = '';
    img.src = `https://sitesave-screenshots.wpwojda.workers.dev/?url=${encodeURIComponent(b.url)}`;
  }

  const tryBtn = document.getElementById('preview-try-live');
  if (tryBtn) {
    tryBtn.style.display = 'inline-flex';
    tryBtn.onclick = () => tryLivePreview(b);
  }
}

function tryLivePreview(b) {
  const tryBtn = document.getElementById('preview-try-live');
  if (tryBtn) tryBtn.style.display = 'none';
  document.getElementById('preview-loading').style.display = 'flex';
  document.getElementById('preview-screenshot').style.display = 'none';
  const iframe = document.getElementById('preview-iframe');
  iframe.onload = iframe.onerror = null;
  iframe.removeAttribute('src');
  let resolved = false;
  setTimeout(() => {
    iframe.onload = () => {
      if (resolved) return;
      try {
        const loc = iframe.contentWindow?.location?.href || '';
        if (loc.startsWith('chrome-error://') || loc.includes('chromewebdata')) {
          resolved = true; showPreviewFallback(b.url, true); return;
        }
        resolved = true;
        document.getElementById('preview-loading').style.display = 'none';
        document.getElementById('preview-screenshot').style.display = 'none';
        iframe.style.display = 'block';
        iframe.style.height = '100%';
      } catch(e) {
        resolved = true;
        document.getElementById('preview-loading').style.display = 'none';
        document.getElementById('preview-screenshot').style.display = 'none';
        iframe.style.display = 'block';
        iframe.style.height = '100%';
      }
    };
    iframe.onerror = () => { if (!resolved) { resolved = true; showPreviewFallback(b.url, true); } };
    setTimeout(() => { if (!resolved) { resolved = true; showPreviewFallback(b.url, true); } }, 12000);
    resolved = false;
    iframe.src = b.url;
  }, 100);
}

function showPreviewFallback(url, showMsg = true) {
  document.getElementById('preview-loading').style.display = 'none';
  const iframe = document.getElementById('preview-iframe');
  iframe.onload = iframe.onerror = null;
  iframe.removeAttribute('src');
  iframe.style.display = 'none';
  const ss = document.getElementById('preview-screenshot');
  ss.style.display = 'flex';
  const msgEl = document.getElementById('preview-blocked-msg');
  if (msgEl && showMsg) msgEl.classList.remove('hidden');
  const img = ss.querySelector('img');
  if (img && !img.getAttribute('src')) img.src = `https://sitesave-screenshots.wpwojda.workers.dev/?url=${encodeURIComponent(url)}`;
}

function closePreview() {
  document.getElementById('preview-ov').classList.add('hidden');
  document.body.style.overflow = '';
  const iframe = document.getElementById('preview-iframe');
  iframe.onload = iframe.onerror = null;
  iframe.removeAttribute('src');
  iframe.style.display = 'none';
  iframe.style.height = '';
  const tryBtn = document.getElementById('preview-try-live');
  if (tryBtn) { tryBtn.style.display = 'none'; tryBtn.onclick = null; }
  const msgEl = document.getElementById('preview-blocked-msg');
  if (msgEl) msgEl.classList.add('hidden');
  const ss = document.getElementById('preview-screenshot');
  ss.style.display = 'none';
  const img = ss.querySelector('img');
  if (img) { img.removeAttribute('src'); img.style.display = ''; }
  const errEl = document.getElementById('preview-ss-error');
  if (errEl) errEl.style.display = 'none';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePreview();
});

const pOv = document.getElementById('preview-ov');
