<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitesave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --bg:        #f7f6f4;
  --bg2:       #f0eeeb;
  --surface:   #ffffff;
  --border:    rgba(0,0,0,.09);
  --border-md: rgba(0,0,0,.15);
  --text:      #111110;
  --text2:     #6b6a67;
  --text3:     #a5a39e;
  --accent:    #111110;
  --accent-fg: #f7f6f4;
  --tag-bg:    rgba(0,0,0,.05);
  --tag-c:     #4a4945;
  --danger:    #c0392b;
  --r:         8px;
  --header-blur: rgba(247,246,244,.9);
  --trans: color .18s, background .18s, border-color .18s, opacity .18s;
}

[data-theme="dark"] {
  --bg:        #0f0f0e;
  --bg2:       #1a1917;
  --surface:   #1f1e1c;
  --border:    rgba(255,255,255,.08);
  --border-md: rgba(255,255,255,.14);
  --text:      #f0eeea;
  --text2:     #8a8880;
  --text3:     #4e4b46;
  --accent:    #f0eeea;
  --accent-fg: #0f0f0e;
  --tag-bg:    rgba(255,255,255,.07);
  --tag-c:     #b0ada7;
  --header-blur: rgba(15,15,14,.9);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Geist', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: var(--trans);
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 200;
  height: 54px;
  background: var(--header-blur);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 16px;
}

.logo {
  font-family: 'Geist', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--text);
  text-decoration: none;
  letter-spacing: -.03em;
  flex-shrink: 0;
  transition: var(--trans);
}

.search-wrap { flex: 1; max-width: 320px; position: relative; }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text3); pointer-events: none; width: 14px; height: 14px;
}
.search-input {
  width: 100%; height: 34px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 0 10px 0 32px;
  font-family: 'Geist', sans-serif; font-size: 14px; color: var(--text);
  outline: none; transition: var(--trans);
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--border-md); background: var(--surface); }

.hdr-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ── THEME TOGGLE ───────────────────────────────────────────── */
.theme-btn {
  width: 34px; height: 34px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); transition: var(--trans);
  flex-shrink: 0;
}
.theme-btn:hover { border-color: var(--border-md); color: var(--text); }

/* sun shown in dark mode, moon shown in light mode */
.icon-sun  { display: none; width: 15px; height: 15px; }
.icon-moon { display: block; width: 15px; height: 15px; }
[data-theme="dark"] .icon-sun  { display: block; }
[data-theme="dark"] .icon-moon { display: none; }

.btn-add {
  height: 34px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: var(--accent-fg);
  border: none; border-radius: 6px;
  font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; white-space: nowrap; letter-spacing: -.02em;
  transition: opacity .15s;
}
.btn-add:hover { opacity: .8; }

/* ── SHELL ──────────────────────────────────────────────────── */
.shell { display: flex; min-height: calc(100vh - 54px); }

/* ── SIDEBAR ────────────────────────────────────────────────── */
aside {
  width: 200px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 16px 10px;
  background: var(--bg);
  position: sticky; top: 54px; height: calc(100vh - 54px); overflow-y: auto;
  transition: var(--trans);
}

.sb-sec { margin-bottom: 20px; }
.sb-hd {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text3); padding: 0 8px; margin-bottom: 4px;
  transition: var(--trans);
}
.sb-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 8px; border-radius: 5px; cursor: pointer;
  margin-bottom: 1px; border: 1px solid transparent;
  transition: var(--trans);
  position: relative;
}
.sb-item:hover { background: var(--bg2); }
.sb-item.on { background: var(--bg2); border-color: var(--border); }

/* tag row — label + count + delete */
.sb-tag-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; gap: 4px;
}
.sb-lbl {
  display: flex; align-items: center; gap: 7px;
  font-size: 14px; color: var(--text2); transition: var(--trans);
  min-width: 0; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sb-item.on .sb-lbl { color: var(--text); font-weight: 500; }
.sb-ico { width: 14px; text-align: center; color: var(--text3); font-size: 14px; transition: var(--trans); flex-shrink: 0; }
.sb-item.on .sb-ico { color: var(--text); }
.sb-n {
  font-family: 'Geist Mono', monospace; font-size: 11px;
  color: var(--text3); transition: var(--trans); flex-shrink: 0;
}
.sb-item.on .sb-n { color: var(--text2); }

/* delete tag button — only visible on hover */
.sb-del-tag {
  width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); opacity: 0; transition: opacity .15s, color .15s, background .15s;
}
.sb-item:hover .sb-del-tag { opacity: 1; }
.sb-del-tag:hover { color: var(--danger); background: rgba(192,57,43,.1); }

.sb-div { height: 1px; background: var(--border); margin: 10px 4px; }
.tag-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; opacity: .7; }

/* ── MAIN ───────────────────────────────────────────────────── */
main { flex: 1; min-width: 0; padding: 20px 20px 60px; }

/* ── TOPBAR ─────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
}
.topbar-l { display: flex; align-items: baseline; gap: 8px; }
.pg-title {
  font-size: 18px; font-weight: 600; letter-spacing: -.03em;
  color: var(--text); transition: var(--trans);
}
.pg-count {
  font-family: 'Geist Mono', monospace; font-size: 11px;
  color: var(--text3); transition: var(--trans);
}

.sort-sel {
  height: 32px; padding: 0 10px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 5px;
  font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--text2);
  outline: none; cursor: pointer; transition: var(--trans);
}

/* ── PILLS ──────────────────────────────────────────────────── */
.pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; }
.pill {
  height: 28px; padding: 0 11px;
  display: inline-flex; align-items: center;
  border: 1px solid var(--border); border-radius: 20px;
  background: transparent; font-size: 14px; color: var(--text2);
  cursor: pointer; transition: var(--trans); white-space: nowrap;
  font-family: 'Geist', sans-serif;
}
.pill:hover { border-color: var(--border-md); color: var(--text); }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* ── GRID ───────────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
@media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }

/* ── CARD ───────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  transition: border-color .2s, transform .2s, background .2s;
  animation: up .28s ease both;
  display: flex; flex-direction: column;
}
.card:hover { border-color: var(--border-md); transform: translateY(-1px); }
@keyframes up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ── IFRAME / EMBED ─────────────────────────────────────────── */
.card-embed {
  position: relative;
  width: 100%;
  padding-top: 62.5%;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.card-embed iframe {
  position: absolute; top: 0; left: 0;
  width: 1440px; height: 900px;
  transform-origin: top left;
  border: none; background: #fff;
}

/* shimmer */
.embed-loading {
  position: absolute; inset: 0; z-index: 1;
  background: var(--bg2); overflow: hidden;
}
.embed-loading::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, var(--surface) 50%, transparent 100%);
  background-size: 200% 100%;
  animation: shimmer 1.6s infinite; opacity: .5;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* fallback screenshot */
.card-embed-fallback {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  pointer-events: none;
}
.fallback-shot {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .4s ease;
}
.card:hover .fallback-shot { transform: scale(1.025); }
.fb-overlay {
  position: absolute; left: 10px; right: 10px; bottom: 10px;
  padding: 7px 10px; border-radius: 5px;
  background: rgba(0,0,0,.5); backdrop-filter: blur(12px);
  color: rgba(255,255,255,.7);
  font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .03em;
}

/* card action buttons */
.card-actions {
  position: absolute; top: 8px; right: 8px;
  display: flex; gap: 4px; z-index: 10;
  opacity: 0; transition: opacity .15s;
}
.card:hover .card-actions { opacity: 1; }
.ca {
  width: 28px; height: 28px; border-radius: 5px;
  background: var(--surface); border: 1px solid var(--border-md);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 12px; color: var(--text2);
  transition: var(--trans);
}
.ca:hover { color: var(--text); }
.ca.fav-on { color: var(--danger); }
.ca.del:hover { color: var(--danger); }

/* ── CARD FOOTER ────────────────────────────────────────────── */
.card-foot {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  background: var(--surface); flex-shrink: 0;
  min-height: 44px; transition: var(--trans);
}
.foot-fav {
  width: 18px; height: 18px; border-radius: 4px;
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg2);
}
.foot-fav img { width: 12px; height: 12px; display: block; }
.foot-name {
  font-size: 14px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0; letter-spacing: -.02em; transition: var(--trans);
}
.foot-tags { display: flex; gap: 3px; flex-wrap: wrap; flex-shrink: 0; max-width: 52%; }
.tag-chip {
  font-family: 'Geist Mono', monospace; font-size: 11px;
  padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  max-width: 110px; overflow: hidden; text-overflow: ellipsis;
  background: var(--tag-bg); color: var(--tag-c);
  transition: var(--trans);
}
.foot-ext {
  width: 28px; height: 28px; border-radius: 5px; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--text2);
  transition: var(--trans);
}
.foot-ext:hover { border-color: var(--border-md); color: var(--text); }

/* ── EMPTY ──────────────────────────────────────────────────── */
.empty { text-align: center; padding: 80px 20px; animation: up .4s ease; }
.empty-icon { font-size: 28px; margin-bottom: 12px; opacity: .2; }
.empty-title { font-size: 18px; font-weight: 500; color: var(--text2); margin-bottom: 6px; letter-spacing: -.02em; transition: var(--trans); }
.empty-sub { font-size: 14px; color: var(--text3); margin-bottom: 18px; transition: var(--trans); }

/* ── MODAL ──────────────────────────────────────────────────── */
.m-ov {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.38); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fi .15s ease;
}
@keyframes fi { from{opacity:0} to{opacity:1} }

.modal {
  background: var(--surface); border: 1px solid var(--border-md);
  border-radius: 10px; width: 100%; max-width: 440px; padding: 26px;
  animation: mu .2s ease; transition: background .18s, border-color .18s;
  box-shadow: 0 24px 80px rgba(0,0,0,.22);
}
@keyframes mu { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.m-title {
  font-size: 18px; font-weight: 600; letter-spacing: -.03em;
  margin-bottom: 18px; color: var(--text); transition: var(--trans);
}
.fg { margin-bottom: 13px; }
.flabel {
  display: block; font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 5px; transition: var(--trans);
}
.finput {
  width: 100%; height: 36px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 0 11px; font-family: 'Geist', sans-serif; font-size: 14px; color: var(--text);
  outline: none; transition: var(--trans);
}
.finput::placeholder { color: var(--text3); }
.finput:focus { border-color: var(--border-md); background: var(--surface); }

/* tag input */
.tag-input-wrap {
  min-height: 36px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; cursor: text; transition: var(--trans);
}
.tag-input-wrap:focus-within { border-color: var(--border-md); background: var(--surface); }
.tag-token {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 20px; font-size: 12px;
  background: var(--tag-bg); color: var(--tag-c);
  border: 1px solid var(--border);
  font-family: 'Geist Mono', monospace; transition: var(--trans);
}
.tag-token button {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 12px; line-height: 1; padding: 0;
  transition: color .12s;
}
.tag-token button:hover { color: var(--text); }
.tag-bare-input {
  border: none; outline: none; background: transparent;
  font-family: 'Geist', sans-serif; font-size: 14px; color: var(--text);
  min-width: 100px; flex: 1;
}
.tag-bare-input::placeholder { color: var(--text3); }

/* colour picker */
.c-row { display: flex; gap: 6px; flex-wrap: wrap; }
.c-chip {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: transform .11s;
  outline: 2px solid transparent; outline-offset: 2px;
}
.c-chip:hover { transform: scale(1.15); }
.c-chip.on { outline-color: var(--text); }

.m-foot { display: flex; justify-content: flex-end; gap: 7px; margin-top: 18px; }
.btn-ghost {
  height: 34px; padding: 0 13px; background: none;
  border: 1px solid var(--border); border-radius: 6px;
  font-family: 'Geist', sans-serif; font-size: 14px; color: var(--text2);
  cursor: pointer; transition: var(--trans);
}
.btn-ghost:hover { border-color: var(--border-md); color: var(--text); }

/* ── TOAST ──────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  border-radius: 6px; padding: 9px 16px; font-size: 14px; z-index: 999;
  white-space: nowrap; font-family: 'Geist Mono', monospace; letter-spacing: .02em;
  animation: ti .18s ease, to .18s ease 2.2s both;
  transition: background .18s, color .18s;
}
@keyframes ti { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%)} }
@keyframes to  { to{opacity:0} }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#">Sitesave</a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 14 14" fill="none">
      <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <input class="search-input" id="q" placeholder="Search…" oninput="renderCards()">
  </div>

  <div class="hdr-r">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light/dark mode">
      <!-- Sun — shown in dark mode -->
      <svg class="icon-sun" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <!-- Crescent moon — shown in light mode -->
      <svg class="icon-moon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6.002 6.002 0 0 0 0 11 6 6 0 0 0 8-3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="btn-add" onclick="openModal()">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Save site
    </button>
  </div>
</header>

<div class="shell">
  <!-- SIDEBAR -->
  <aside>
    <div class="sb-sec">
      <div class="sb-hd">Library</div>
      <div class="sb-item on" onclick="setFilter('all',this)">
        <span class="sb-lbl"><span class="sb-ico">⊞</span>All</span>
        <span class="sb-n" id="cnt-all">0</span>
      </div>
      <div class="sb-item" onclick="setFilter('fav',this)">
        <span class="sb-lbl"><span class="sb-ico">♥</span>Favourites</span>
        <span class="sb-n" id="cnt-fav">0</span>
      </div>
      <div class="sb-item" onclick="setFilter('recent',this)">
        <span class="sb-lbl"><span class="sb-ico">◷</span>Recent</span>
        <span class="sb-n" id="cnt-rec">0</span>
      </div>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-hd">Tags</div>
      <div id="sb-tags"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="topbar">
      <div class="topbar-l">
        <div class="pg-title" id="pg-title">All</div>
        <div class="pg-count" id="pg-count">0 sites</div>
      </div>
      <select class="sort-sel" onchange="S.sort=this.value;renderCards()">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="alpha">A–Z</option>
        <option value="domain">Domain</option>
      </select>
    </div>

    <div class="pills" id="pills"></div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div class="m-ov hidden" id="m-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-title" id="m-title">Save a site</div>

    <div class="fg">
      <label class="flabel">URL</label>
      <input class="finput" id="f-url" placeholder="https://" oninput="hintName()">
    </div>
    <div class="fg">
      <label class="flabel">Name</label>
      <input class="finput" id="f-name" placeholder="Auto-filled from domain">
    </div>
    <div class="fg">
      <label class="flabel">Tags — Enter or comma to add</label>
      <div class="tag-input-wrap" id="tag-wrap" onclick="document.getElementById('tag-bare').focus()">
        <input class="tag-bare-input" id="tag-bare" placeholder="e.g. typography, layouts…"
               onkeydown="handleTagKey(event)" list="tag-dl">
        <datalist id="tag-dl"></datalist>
      </div>
    </div>
    <div class="fg">
      <label class="flabel">Label colour</label>
      <div class="c-row" id="c-row"></div>
    </div>

    <div class="m-foot">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-add" onclick="saveBM()">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5.5l2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save
      </button>
    </div>
  </div>
</div>

<script>
// ── THEME ────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'light' ? 'dark' : 'light';
  html.dataset.theme = next;
  localStorage.setItem('sitesave-theme', next);
}
(function() {
  const saved = localStorage.getItem('sitesave-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = 'dark';
})();

// ── STATE ────────────────────────────────────────────────────
const KEY = 'sitesave-v1';
let BM = JSON.parse(localStorage.getItem(KEY) || '[]');
let S  = { filter:'all', sort:'newest', editId:null, color:'#111110', tags:[] };

const COLORS = ['#111110','#6b6a67','#a5a39e','#c0392b','#d97706','#16a34a','#2563eb','#7c3aed','#db2777','#0891b2'];

// ── BOOT ─────────────────────────────────────────────────────
function init() {
  if (!BM.length) seed();
  buildColors();
  render();
}

function seed() {
  const n = Date.now();
  BM = [
    { id:uid(), url:'https://stripe.com',   name:'Stripe',          tags:['checkout','ux patterns'],   color:'#6b6a67', fav:true,  date:n-864e5*2  },
    { id:uid(), url:'https://linear.app',   name:'Linear',          tags:['product design','dark mode'],color:'#7c3aed', fav:true,  date:n-864e5*3  },
    { id:uid(), url:'https://vercel.com',   name:'Vercel',          tags:['typography','landing'],      color:'#111110', fav:false, date:n-864e5*5  },
    { id:uid(), url:'https://arc.net',      name:'Arc Browser',     tags:['ux patterns'],               color:'#d97706', fav:false, date:n-864e5*7  },
    { id:uid(), url:'https://rauno.me',     name:'Rauno Freiberg',  tags:['portfolio','interactions'],  color:'#c0392b', fav:true,  date:n-864e5*10 },
    { id:uid(), url:'https://mobbin.com',   name:'Mobbin',          tags:['reference','ux patterns'],   color:'#2563eb', fav:true,  date:n-864e5*6  },
  ];
  persist();
}

function persist() { localStorage.setItem(KEY, JSON.stringify(BM)); }

// ── FILTER / SORT ────────────────────────────────────────────
function visible() {
  let list = [...BM];
  const q = document.getElementById('q').value.trim().toLowerCase();
  if      (S.filter === 'fav')    list = list.filter(b => b.fav);
  else if (S.filter === 'recent') list = list.filter(b => Date.now()-b.date < 864e5*7);
  else if (S.filter !== 'all')    list = list.filter(b => (b.tags||[]).map(t=>t.toLowerCase()).includes(S.filter.toLowerCase()));
  if (q) list = list.filter(b =>
    b.name.toLowerCase().includes(q) ||
    b.url.toLowerCase().includes(q)  ||
    (b.tags||[]).some(t=>t.toLowerCase().includes(q)));
  if      (S.sort==='newest') list.sort((a,b)=>b.date-a.date);
  else if (S.sort==='oldest') list.sort((a,b)=>a.date-b.date);
  else if (S.sort==='alpha')  list.sort((a,b)=>a.name.localeCompare(b.name));
  else if (S.sort==='domain') list.sort((a,b)=>host(a.url).localeCompare(host(b.url)));
  return list;
}

// ── RENDER ───────────────────────────────────────────────────
function render() { renderSidebar(); renderPills(); renderCards(); }

function renderCards() {
  const list = visible();
  const g = document.getElementById('grid');
  const TITLES = { all:'All', fav:'Favourites', recent:'Recent' };
  document.getElementById('pg-title').textContent = TITLES[S.filter] || S.filter;
  document.getElementById('pg-count').textContent = `${list.length} site${list.length!==1?'s':''}`;

  if (!list.length) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">◫</div>
      <div class="empty-title">Nothing here yet</div>
      <div class="empty-sub">Save your first site to get started.</div>
      <button class="btn-add" style="display:inline-flex;margin:0 auto" onclick="openModal()">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Save site
      </button>
    </div>`;
    return;
  }
  g.innerHTML = list.map((b,i) => card(b,i)).join('');
  requestAnimationFrame(scaleIframes);
}

function card(b, i) {
  const h   = host(b.url);
  const tags = (b.tags||[]);
  const tagChips = tags.map(t => `<span class="tag-chip">${x(t)}</span>`).join('');

  return `
<div class="card" style="animation-delay:${i*.03}s">
  <div class="card-embed">
    <div class="embed-loading" id="load-${b.id}"></div>
    <iframe
      id="if-${b.id}"
      src="${x(b.url)}"
      title="${x(b.name)}"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-modals"
      referrerpolicy="no-referrer"
      loading="lazy"
      onload="iframeLoaded('${b.id}')"
      onerror="iframeFailed('${b.id}')">
    </iframe>
    <div class="card-embed-fallback hidden" id="fb-${b.id}">
      <img
        class="fallback-shot"
        src="https://image.thum.io/get/width/1200/${x(b.url)}"
        loading="lazy"
        alt="${x(b.name)} preview">
      <div class="fb-overlay">${h} · snapshot</div>
    </div>
    <div class="card-actions">
      <div class="ca ${b.fav?'fav-on':''}" onclick="toggleFav('${b.id}')" title="${b.fav?'Remove from favourites':'Add to favourites'}">${b.fav?'♥':'♡'}</div>
      <div class="ca" onclick="openModal('${b.id}')" title="Edit">✎</div>
      <div class="ca del" onclick="delBM('${b.id}')" title="Remove">✕</div>
    </div>
  </div>

  <div class="card-foot">
    <div class="foot-fav">
      <img src="https://www.google.com/s2/favicons?domain=${h}&sz=32"
           onerror="this.style.display='none'" loading="lazy">
    </div>
    <span class="foot-name">${x(b.name)}</span>
    ${tags.length ? `<div class="foot-tags">${tagChips}</div>` : ''}
    <a class="foot-ext" href="${x(b.url)}" target="_blank" rel="noopener" title="Open site">
      <svg width="11" height="11" viewBox="0 0 13 13" fill="none"><path d="M2.5 10.5L10.5 2.5M4.5 2.5h6v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>`;
}

// ── IFRAME HANDLING ──────────────────────────────────────────
function iframeLoaded(id) {
  const loader = document.getElementById('load-'+id);
  if (loader) loader.style.display = 'none';
  try {
    const doc = document.getElementById('if-'+id)?.contentDocument;
    if (doc && (!doc.body || doc.body.innerHTML.trim() === '')) iframeFailed(id);
  } catch(e) { /* cross-origin — loaded fine */ }
}

function iframeFailed(id) {
  const ifr    = document.getElementById('if-'+id);
  const fb     = document.getElementById('fb-'+id);
  const loader = document.getElementById('load-'+id);
  if (loader) loader.style.display = 'none';
  if (ifr) ifr.classList.add('hidden');
  if (fb)  fb.classList.remove('hidden');
}

function checkIframes() {
  document.querySelectorAll('.card-embed iframe').forEach(ifr => {
    try {
      const doc = ifr.contentDocument || ifr.contentWindow?.document;
      if (doc && (!doc.body || doc.body.innerHTML.trim() === ''))
        iframeFailed(ifr.id.replace('if-',''));
    } catch(e) {}
  });
}
window.addEventListener('load', () => setTimeout(checkIframes, 3000));

// ── IFRAME SCALING ───────────────────────────────────────────
const IFRAME_W = 1440;

function scaleIframes() {
  document.querySelectorAll('.card-embed').forEach(embed => {
    const ifr = embed.querySelector('iframe');
    if (!ifr) return;
    ifr.style.transform = `scale(${embed.offsetWidth / IFRAME_W})`;
  });
}

const _ro = new ResizeObserver(scaleIframes);
_ro.observe(document.querySelector('.shell') || document.body);
window.addEventListener('resize', scaleIframes);

// ── SIDEBAR ──────────────────────────────────────────────────
function renderSidebar() {
  document.getElementById('cnt-all').textContent = BM.length;
  document.getElementById('cnt-fav').textContent = BM.filter(b=>b.fav).length;
  document.getElementById('cnt-rec').textContent = BM.filter(b=>Date.now()-b.date<864e5*7).length;

  const allTags = allUniqueTags();
  document.getElementById('sb-tags').innerHTML = allTags.map(tag => {
    const matches = BM.filter(b=>(b.tags||[]).map(t=>t.toLowerCase()).includes(tag.toLowerCase()));
    const on      = S.filter.toLowerCase() === tag.toLowerCase();
    const dotColor = matches[0]?.color || '#6b6a67';
    // Use data attribute to safely pass tag name; stopPropagation prevents filter trigger on delete
    return `<div class="sb-item ${on?'on':''}" onclick="setFilter('${x(tag)}',this)">
      <span class="sb-tag-row">
        <span class="sb-lbl">
          <span class="tag-dot" style="background:${dotColor}"></span>${x(tag)}
        </span>
        <span style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          <span class="sb-n">${matches.length}</span>
          <button class="sb-del-tag" title="Delete tag category"
            onclick="event.stopPropagation();deleteTagCategory('${x(tag)}')"
            aria-label="Delete tag ${x(tag)}">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </span>
      </span>
    </div>`;
  }).join('');

  document.getElementById('tag-dl').innerHTML = allTags.map(t=>`<option value="${x(t)}">`).join('');
}

// ── DELETE TAG CATEGORY ──────────────────────────────────────
// Removes the tag from every bookmark it appears in, then re-renders.
// If currently filtering by that tag, resets to "all".
function deleteTagCategory(tag) {
  const lower = tag.toLowerCase();
  BM = BM.map(b => ({
    ...b,
    tags: (b.tags||[]).filter(t => t.toLowerCase() !== lower)
  }));
  if (S.filter.toLowerCase() === lower) S.filter = 'all';
  persist();
  render();
  toast(`Tag "${tag}" deleted`);
}

function allUniqueTags() {
  const seen = new Set();
  BM.forEach(b => (b.tags||[]).forEach(t => seen.add(t)));
  return [...seen].sort();
}

// ── PILLS ────────────────────────────────────────────────────
function renderPills() {
  const tags = allUniqueTags();
  const base = [{l:'All',v:'all'},{l:'♥ Favourites',v:'fav'}];
  const all  = [...base, ...tags.map(t=>({l:t,v:t}))];
  document.getElementById('pills').innerHTML = all.map(p =>
    `<div class="pill ${S.filter===p.v?'on':''}" onclick="setFilter('${p.v}',null)">${x(p.l)}</div>`
  ).join('');
}

function setFilter(f, el) {
  S.filter = f;
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('on'));
  if (el) el.classList.add('on');
  render();
}

// ── MODAL ────────────────────────────────────────────────────
let modalTags = [];

function openModal(id=null) {
  S.editId = id;
  modalTags = [];
  document.getElementById('m-title').textContent = id ? 'Edit site' : 'Save a site';
  if (id) {
    const b = BM.find(b=>b.id===id);
    document.getElementById('f-url').value  = b.url;
    document.getElementById('f-name').value = b.name;
    modalTags = [...(b.tags||[])];
    S.color = b.color;
  } else {
    document.getElementById('f-url').value  = '';
    document.getElementById('f-name').value = '';
    S.color = COLORS[0];
  }
  renderTagTokens();
  buildColors();
  document.getElementById('m-ov').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-url').focus(), 80);
}

function closeModal() {
  document.getElementById('m-ov').classList.add('hidden');
  S.editId = null; modalTags = [];
}

function renderTagTokens() {
  const wrap = document.getElementById('tag-wrap');
  wrap.querySelectorAll('.tag-token').forEach(el=>el.remove());
  const input = document.getElementById('tag-bare');
  modalTags.forEach((t,i) => {
    const el = document.createElement('span');
    el.className = 'tag-token';
    el.innerHTML = `${x(t)}<button onclick="removeTag(${i})" type="button">✕</button>`;
    wrap.insertBefore(el, input);
  });
  input.value = '';
  input.placeholder = modalTags.length ? '' : "e.g. typography, layouts…";
}

function handleTagKey(e) {
  const val = e.target.value.trim();
  if ((e.key === 'Enter' || e.key === ',') && val) {
    e.preventDefault();
    addTag(val.replace(/,$/,'').trim());
  } else if (e.key === 'Backspace' && !e.target.value && modalTags.length) {
    removeTag(modalTags.length-1);
  }
}

function addTag(t) {
  t = t.trim().toLowerCase();
  if (!t || modalTags.map(v=>v.toLowerCase()).includes(t)) return;
  modalTags.push(t);
  renderTagTokens();
}

function removeTag(i) { modalTags.splice(i,1); renderTagTokens(); }

function saveBM() {
  const bare = document.getElementById('tag-bare').value.trim().replace(/,$/,'').trim();
  if (bare) addTag(bare);
  let url = document.getElementById('f-url').value.trim();
  if (!url) { toast('Please enter a URL'); return; }
  if (!url.startsWith('http')) url = 'https://'+url;
  const name = document.getElementById('f-name').value.trim() || host(url);
  const tags = [...modalTags];
  if (S.editId) {
    const idx = BM.findIndex(b=>b.id===S.editId);
    BM[idx] = { ...BM[idx], url, name, tags, color:S.color };
    toast('Updated');
  } else {
    BM.unshift({ id:uid(), url, name, tags, color:S.color, fav:false, date:Date.now() });
    toast('Saved');
  }
  persist(); closeModal(); render();
}

function hintName() {
  const url = document.getElementById('f-url').value.trim();
  const n   = document.getElementById('f-name');
  if (url && !n.value) n.placeholder = host(url.startsWith('http') ? url : 'https://'+url);
}

// ── ACTIONS ──────────────────────────────────────────────────
function toggleFav(id) { const b=BM.find(b=>b.id===id); if(b){b.fav=!b.fav;persist();render();} }
function delBM(id) {
  if (!confirm('Remove this site?')) return;
  BM = BM.filter(b=>b.id!==id); persist(); render(); toast('Removed');
}

// ── COLOURS ──────────────────────────────────────────────────
function buildColors() {
  document.getElementById('c-row').innerHTML = COLORS.map(c =>
    `<div class="c-chip" style="background:${c}" onclick="S.color='${c}';updateColors()" title="${c}"></div>`
  ).join('');
  updateColors();
}
function updateColors() {
  document.querySelectorAll('.c-chip').forEach(el=>{
    el.classList.toggle('on', toHex(el.style.background)===S.color || el.style.background===S.color);
  });
}
function toHex(rgb) {
  const m=rgb.match(/\d+/g); if(!m) return rgb;
  return '#'+m.slice(0,3).map(v=>parseInt(v).toString(16).padStart(2,'0')).join('');
}

// ── UTILS ────────────────────────────────────────────────────
function uid()   { return Math.random().toString(36).slice(2,10); }
function host(u) { try{return new URL(u).hostname.replace('www.','')}catch{return u;} }
function x(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _tt;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); clearTimeout(_tt); _tt=setTimeout(()=>el.remove(),2500);
}

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') closeModal();
  if (e.key==='n' && e.target===document.body) openModal();
  if (e.key==='/' && e.target===document.body){ e.preventDefault(); document.getElementById('q').focus(); }
});

init();
</script>
</body>
</html>
