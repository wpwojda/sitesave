<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitesave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#">Sitesave</a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 14 14" fill="none">
      <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <input class="search-input" id="q" placeholder="Search…" oninput="renderCards()">
  </div>

  <div class="hdr-r">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light/dark mode">
      <svg class="icon-sun" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 16 16" fill="none">
        <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6.002 6.002 0 0 0 0 11 6 6 0 0 0 8-3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="btn-add" onclick="openModal()">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Save site
    </button>
  </div>
</header>

<div class="shell">

  <!-- SIDEBAR -->
  <aside>
    <div class="sb-sec">
      <div class="sb-hd">Library</div>
      <div class="sb-item on" onclick="setFilter('all', this)">
        <span class="sb-lbl"><span class="sb-ico">⊞</span>All</span>
        <span class="sb-n" id="cnt-all">0</span>
      </div>
      <div class="sb-item" onclick="setFilter('fav', this)">
        <span class="sb-lbl"><span class="sb-ico">♥</span>Favourites</span>
        <span class="sb-n" id="cnt-fav">0</span>
      </div>
      <div class="sb-item" onclick="setFilter('recent', this)">
        <span class="sb-lbl"><span class="sb-ico">◷</span>Recent</span>
        <span class="sb-n" id="cnt-rec">0</span>
      </div>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-hd">Tags</div>
      <div id="sb-tags"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="topbar">
      <div class="topbar-l">
        <div class="pg-title" id="pg-title">All</div>
        <div class="pg-count" id="pg-count">0 sites</div>
      </div>
      <select class="sort-sel" onchange="S.sort=this.value;renderCards()">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="alpha">A–Z</option>
        <option value="domain">Domain</option>
      </select>
    </div>
    <div class="pills" id="pills"></div>
    <div id="grid" class="grid"></div>
  </main>

</div>

<!-- PREVIEW MODAL -->
<div class="preview-ov hidden" id="preview-ov">
  <div class="preview-bar">
    <div class="preview-favicon">
      <img id="preview-fav-img" src="" alt="">
    </div>
    <span class="preview-title" id="preview-title"></span>
    <span class="preview-url"   id="preview-url"></span>
    <div class="preview-actions">
      <a class="preview-btn" id="preview-ext-link" href="#" target="_blank" rel="noopener" title="Open in new tab">
        <svg width="11" height="11" viewBox="0 0 13 13" fill="none"><path d="M2.5 10.5L10.5 2.5M4.5 2.5h6v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Open
      </a>
      <button class="preview-btn close-btn" onclick="closePreview()" title="Close">&#x2715; Close</button>
    </div>
  </div>
  <div class="preview-body">
    <div class="preview-loading" id="preview-loading">
      <div class="preview-loading-spinner"></div>
      <span>Loading preview…</span>
    </div>
    <iframe
      class="preview-iframe"
      id="preview-iframe"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-modals"
      referrerpolicy="no-referrer">
    </iframe>
    <div class="preview-screenshot" id="preview-screenshot">
      <img src="" alt="Site screenshot">
      <p>Live preview unavailable for this site — showing screenshot instead.</p>
    </div>
  </div>
</div>

<!-- SAVE / EDIT MODAL -->
<div class="m-ov hidden" id="m-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-title" id="m-title">Save a site</div>
    <div class="fg">
      <label class="flabel">URL</label>
      <input class="finput" id="f-url" placeholder="https://" oninput="hintName()">
    </div>
    <div class="fg">
      <label class="flabel">Name</label>
      <input class="finput" id="f-name" placeholder="Auto-filled from domain">
    </div>
    <div class="fg">
      <label class="flabel">Tags — Enter or comma to add</label>
      <div class="tag-input-wrap" id="tag-wrap" onclick="document.getElementById('tag-bare').focus()">
        <input class="tag-bare-input" id="tag-bare"
               placeholder="e.g. typography, layouts…"
               onkeydown="handleTagKey(event)" list="tag-dl">
        <datalist id="tag-dl"></datalist>
      </div>
    </div>
    <div class="fg">
      <label class="flabel">Label colour</label>
      <div class="c-row" id="c-row"></div>
    </div>
    <div class="m-foot">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-add" onclick="saveBM()">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5.5l2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save
      </button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
