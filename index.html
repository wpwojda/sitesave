<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webmarker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f0efec;
    --surface:   #ffffff;
    --surface2:  #e9e8e4;
    --border:    #dddbd5;
    --border-dk: #c4c1b8;
    --text:      #18170f;
    --muted:     #706e67;
    --dim:       #aaa89f;
    --accent:    #2563eb;
    --accent-bg: #eff4fe;
    --sh-sm:     0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --sh-md:     0 4px 16px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.04);
    --sh-lg:     0 16px 48px rgba(0,0,0,.13),0 4px 14px rgba(0,0,0,.06);
    --r:         10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ───────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 200;
    height: 56px;
    background: rgba(240,239,236,.94);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 22px; gap: 14px;
    justify-content: space-between;
  }

  .logo {
    font-size: 15px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; text-decoration: none; letter-spacing: -.01em;
  }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }

  .search-wrap { flex: 1; max-width: 340px; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
  .search-input {
    width: 100%; height: 34px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 12px 0 32px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--text);
    outline: none; box-shadow: var(--sh-sm);
    transition: border-color .14s, box-shadow .14s;
  }
  .search-input::placeholder { color: var(--dim); }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.11); }

  .hdr-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .btn-add {
    height: 34px; padding: 0 14px;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(37,99,235,.26); transition: background .13s;
  }
  .btn-add:hover { background: #1d4ed8; }

  /* ── SHELL ────────────────────────────────────── */
  .shell { display: flex; min-height: calc(100vh - 56px); }

  /* ── SIDEBAR ──────────────────────────────────── */
  aside {
    width: 204px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 18px 10px; background: var(--bg);
    position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
  }

  .sb-sec { margin-bottom: 22px; }
  .sb-hd {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); padding: 0 8px; margin-bottom: 4px;
  }
  .sb-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 8px; border-radius: 7px; cursor: pointer;
    margin-bottom: 1px; border: 1px solid transparent;
    transition: background .11s;
  }
  .sb-item:hover { background: var(--surface2); }
  .sb-item.on { background: var(--accent-bg); border-color: rgba(37,99,235,.16); }
  .sb-lbl { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--text); }
  .sb-item.on .sb-lbl { color: var(--accent); font-weight: 500; }
  .sb-ico { width: 16px; text-align: center; color: var(--dim); font-size: 13px; }
  .sb-item.on .sb-ico { color: var(--accent); }
  .sb-n {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--dim); background: var(--surface2); padding: 1px 6px; border-radius: 9px;
  }
  .sb-item.on .sb-n { background: rgba(37,99,235,.12); color: var(--accent); }
  .sb-div { height: 1px; background: var(--border); margin: 12px 4px; }
  .tag-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ── MAIN ────────────────────────────────────── */
  main { flex: 1; min-width: 0; padding: 22px 22px 60px; }

  /* ── TOP BAR ─────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
  }
  .topbar-l { display: flex; align-items: center; gap: 10px; }
  .pg-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .pg-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); }
  .topbar-r { display: flex; align-items: center; gap: 8px; }

  .sort-sel {
    height: 32px; padding: 0 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--muted);
    outline: none; cursor: pointer; box-shadow: var(--sh-sm);
  }

  /* ── PILLS ───────────────────────────────────── */
  .pills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 20px; }
  .pill {
    height: 28px; padding: 0 11px;
    display: inline-flex; align-items: center;
    border: 1px solid var(--border); border-radius: 20px;
    background: var(--surface); font-size: 14px; color: var(--muted);
    cursor: pointer; transition: all .12s; white-space: nowrap; box-shadow: var(--sh-sm);
  }
  .pill:hover { border-color: var(--border-dk); color: var(--text); }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.22); }

  /* ── 2-COL GRID ──────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }

  /* ── CARD ────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    box-shadow: var(--sh-sm);
    transition: box-shadow .18s, transform .18s, border-color .18s;
    animation: up .26s ease both;
    display: flex; flex-direction: column;
  }
  .card:hover { box-shadow: var(--sh-lg); transform: translateY(-2px); border-color: var(--border-dk); }

  @keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  /* ── 16:9 IFRAME PREVIEW ─────────────────────── */
  .card-embed {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }

  
  /* iframe preview */
  .card-embed iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 900px;
    transform-origin: top left;
    border: none;
    background: #fff;
    transition: none;
  }

  .embed-loading {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        90deg,
        #eceae5 25%,
        #f7f6f3 50%,
        #eceae5 75%
      );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    z-index: 1;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .fallback-shot {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .35s ease;
  }

  .card:hover .fallback-shot {
    transform: scale(1.03);
  }

  .fb-overlay {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(10px);
    color: white;
  }


  /* fallback shown when iframe is blocked */
  .card-embed-fallback {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: linear-gradient(145deg, var(--surface2) 0%, #f7f6f3 100%);
    pointer-events: none;
  }
  .fb-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: var(--sh-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; overflow: hidden;
  }
  .fb-icon img { width: 32px; height: 32px; display: block; }
  .fb-domain { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .fb-note { font-size: 12px; color: var(--dim); }

  /* ── CARD FOOTER ─────────────────────────────── */
  .card-foot {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--surface); flex-shrink: 0;
    min-height: 46px;
  }

  .foot-fav {
    width: 20px; height: 20px; border-radius: 5px;
    overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2);
  }
  .foot-fav img { width: 14px; height: 14px; display: block; }

  .foot-name {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }

  /* Tags row — shown below name when tags exist */
  .foot-tags { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; max-width: 55%; }
  .tag-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .01em;
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
    max-width: 110px; overflow: hidden; text-overflow: ellipsis;
  }

  .foot-ext {
    width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
    border: 1px solid var(--border); background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; color: var(--muted);
    transition: all .12s;
  }
  .foot-ext:hover { background: var(--accent-bg); color: var(--accent); border-color: rgba(37,99,235,.28); }

  /* Quick edit / fav / delete — appear on card hover */
  .card-actions {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 4px; z-index: 10;
    opacity: 0; transition: opacity .15s;
  }
  .card:hover .card-actions { opacity: 1; }
  .ca {
    width: 28px; height: 28px; border-radius: 7px;
    background: rgba(255,255,255,.93); border: 1px solid rgba(0,0,0,.09);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; color: var(--muted);
    box-shadow: var(--sh-sm); transition: all .11s;
  }
  .ca:hover { background: #fff; color: var(--text); }
  .ca.fav-on { color: #e05a2b; }
  .ca.del:hover { color: #dc2626; }

  /* ── EMPTY ───────────────────────────────────── */
  .empty { text-align: center; padding: 80px 20px; animation: up .4s ease; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: .3; }
  .empty-title { font-size: 17px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .empty-sub { font-size: 14px; color: var(--dim); margin-bottom: 18px; }

  /* ── MODAL ───────────────────────────────────── */
  .m-ov {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(18,17,14,.45); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: fi .15s ease;
  }
  @keyframes fi { from{opacity:0} to{opacity:1} }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; width: 100%; max-width: 460px; padding: 28px;
    box-shadow: 0 24px 80px rgba(0,0,0,.16); animation: mu .2s ease;
  }
  @keyframes mu { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  .m-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 20px; }
  .fg { margin-bottom: 13px; }
  .flabel {
    display: block; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  .finput {
    width: 100%; height: 36px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 0 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--text);
    outline: none; transition: border-color .14s, box-shadow .14s;
  }
  .finput::placeholder { color: var(--dim); }
  .finput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); background: #fff; }

  /* multi-tag input */
  .tag-input-wrap {
    min-height: 36px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; cursor: text; transition: border-color .14s, box-shadow .14s;
  }
  .tag-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); background: #fff; }
  .tag-token {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 20px; font-size: 13px;
    background: var(--accent-bg); color: var(--accent);
    border: 1px solid rgba(37,99,235,.2);
    font-family: 'IBM Plex Mono', monospace;
  }
  .tag-token button {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 12px; line-height: 1; padding: 0; opacity: .7;
  }
  .tag-token button:hover { opacity: 1; }
  .tag-bare-input {
    border: none; outline: none; background: transparent;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--text);
    min-width: 120px; flex: 1;
  }
  .tag-bare-input::placeholder { color: var(--dim); }

  /* color picker */
  .c-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .c-chip {
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform .11s;
    outline: 3px solid transparent; outline-offset: 2px;
  }
  .c-chip:hover { transform: scale(1.12); }
  .c-chip.on { outline-color: var(--accent); }

  .m-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn-ghost {
    height: 34px; padding: 0 14px; background: none;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--muted);
    cursor: pointer; transition: all .12s;
  }
  .btn-ghost:hover { border-color: var(--border-dk); color: var(--text); }

  /* ── TOAST ───────────────────────────────────── */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    border-radius: 8px; padding: 10px 18px; font-size: 14px; z-index: 999;
    box-shadow: var(--sh-lg); white-space: nowrap;
    animation: ti .18s ease, to .18s ease 2.2s both;
  }
  @keyframes ti { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%)} }
  @keyframes to  { to{opacity:0} }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border-dk); border-radius: 2px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1" fill="white"/>
        <rect x="8"   y="1.5" width="4.5" height="4.5" rx="1" fill="white" opacity=".55"/>
        <rect x="1.5" y="8"   width="4.5" height="4.5" rx="1" fill="white" opacity=".55"/>
        <rect x="8"   y="8"   width="4.5" height="4.5" rx="1" fill="white"/>
      </svg>
    </div>
    Webmarker
  </a>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <input class="search-input" id="q" placeholder="Search bookmarks or tags…" oninput="renderCards()">
  </div>

  <div class="hdr-r">
    <button class="btn-add" onclick="openModal()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Add bookmark
    </button>
  </div>
</header>

<div class="shell">
  <!-- SIDEBAR -->
  <aside>
    <div class="sb-sec">
      <div class="sb-hd">Library</div>
      <div class="sb-item on" onclick="setFilter('all',this)">
        <span class="sb-lbl"><span class="sb-ico">⊞</span>All</span>
        <span class="sb-n" id="cnt-all">0</span>
      </div>
      <div class="sb-item" onclick="setFilter('fav',this)">
        <span class="sb-lbl"><span class="sb-ico">♥</span>Favourites</span>
        <span class="sb-n" id="cnt-fav">0</span>
      </div>
      <div class="sb-item" onclick="setFilter('recent',this)">
        <span class="sb-lbl"><span class="sb-ico">◷</span>Recent</span>
        <span class="sb-n" id="cnt-rec">0</span>
      </div>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-hd">Tags</div>
      <div id="sb-tags"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="topbar">
      <div class="topbar-l">
        <div class="pg-title" id="pg-title">All bookmarks</div>
        <div class="pg-count" id="pg-count">0 saved</div>
      </div>
      <div class="topbar-r">
        <select class="sort-sel" onchange="S.sort=this.value;renderCards()">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="alpha">A → Z</option>
          <option value="domain">Domain</option>
        </select>
      </div>
    </div>

    <div class="pills" id="pills"></div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div class="m-ov hidden" id="m-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-title" id="m-title">Add bookmark</div>

    <div class="fg">
      <label class="flabel">URL *</label>
      <input class="finput" id="f-url" placeholder="https://" oninput="hintName()">
    </div>
    <div class="fg">
      <label class="flabel">Site name</label>
      <input class="finput" id="f-name" placeholder="Auto-filled from domain">
    </div>
    <div class="fg">
      <label class="flabel">Tags — type and press Enter or comma to add</label>
      <div class="tag-input-wrap" id="tag-wrap" onclick="document.getElementById('tag-bare').focus()">
        <input class="tag-bare-input" id="tag-bare" placeholder="e.g. typography, grids…"
               onkeydown="handleTagKey(event)" list="tag-dl">
        <datalist id="tag-dl"></datalist>
      </div>
    </div>
    <div class="fg">
      <label class="flabel">Label colour</label>
      <div class="c-row" id="c-row"></div>
    </div>

    <div class="m-foot">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-add" onclick="saveBM()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save
      </button>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────
const KEY = 'webmarker-v3';
let BM = JSON.parse(localStorage.getItem(KEY) || '[]');
let S  = { filter:'all', sort:'newest', editId:null, color:'#2563eb', tags:[] };

const COLORS = ['#2563eb','#d97706','#16a34a','#dc2626','#7c3aed','#0891b2','#db2777','#475569','#b45309','#059669'];

// ── BOOT ──────────────────────────────────────────────────────
function init() {
  if (!BM.length) seed();
  buildColors();
  render();
}

function seed() {
  const n = Date.now();
  BM = [
    { id:uid(), url:'https://stripe.com',  name:'Stripe',         tags:['ux patterns','checkout'],   color:'#475569', fav:true,  date:n-864e5*2  },
    { id:uid(), url:'https://linear.app',  name:'Linear',         tags:['product design','dark mode'],color:'#7c3aed', fav:true,  date:n-864e5*3  },
    { id:uid(), url:'https://vercel.com',  name:'Vercel',         tags:['typography','landing page'], color:'#059669', fav:false, date:n-864e5*5  },
    { id:uid(), url:'https://arc.net',     name:'Arc Browser',    tags:['ux patterns'],               color:'#d97706', fav:false, date:n-864e5*7  },
    { id:uid(), url:'https://rauno.me',    name:'Rauno Freiberg', tags:['portfolio','interactions'],  color:'#db2777', fav:true,  date:n-864e5*10 },
    { id:uid(), url:'https://mobbin.com',  name:'Mobbin',         tags:['ux patterns','reference'],   color:'#2563eb', fav:true,  date:n-864e5*6  },
  ];
  persist();
}

function persist() { localStorage.setItem(KEY, JSON.stringify(BM)); }

// ── FILTER / SORT ─────────────────────────────────────────────
function visible() {
  let list = [...BM];
  const q = document.getElementById('q').value.trim().toLowerCase();
  if      (S.filter === 'fav')    list = list.filter(b => b.fav);
  else if (S.filter === 'recent') list = list.filter(b => Date.now()-b.date < 864e5*7);
  else if (S.filter !== 'all')    list = list.filter(b => (b.tags||[]).map(t=>t.toLowerCase()).includes(S.filter.toLowerCase()));
  if (q) list = list.filter(b =>
    b.name.toLowerCase().includes(q) ||
    b.url.toLowerCase().includes(q)  ||
    (b.tags||[]).some(t=>t.toLowerCase().includes(q)));
  if      (S.sort==='newest') list.sort((a,b)=>b.date-a.date);
  else if (S.sort==='oldest') list.sort((a,b)=>a.date-b.date);
  else if (S.sort==='alpha')  list.sort((a,b)=>a.name.localeCompare(b.name));
  else if (S.sort==='domain') list.sort((a,b)=>host(a.url).localeCompare(host(b.url)));
  return list;
}

// ── RENDER ────────────────────────────────────────────────────
function render() { renderSidebar(); renderPills(); renderCards(); }

function renderCards() {
  const list = visible();
  const g = document.getElementById('grid');
  const TITLES = { all:'All bookmarks', fav:'Favourites', recent:'Recent' };
  document.getElementById('pg-title').textContent = TITLES[S.filter] || S.filter;
  document.getElementById('pg-count').textContent = `${list.length} saved`;

  if (!list.length) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">◫</div>
      <div class="empty-title">Nothing here yet</div>
      <div class="empty-sub">Add your first bookmark to get started.</div>
      <button class="btn-add" style="display:inline-flex;margin:0 auto" onclick="openModal()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Add bookmark
      </button>
    </div>`;
    return;
  }
  g.innerHTML = list.map((b,i) => card(b,i)).join('');
  // Apply correct scale now that cards are in the DOM
  requestAnimationFrame(scaleIframes);
}

function card(b, i) {
  const h  = host(b.url);
  const bg = tint(b.color);
  const tags = (b.tags||[]);

  const tagChips = tags.map(t =>
    `<span class="tag-chip" style="background:${tint(b.color)};color:${b.color};border:1px solid ${b.color}28">${x(t)}</span>`
  ).join('');

  return `
<div class="card" style="animation-delay:${i*.03}s">
  <div class="card-embed">
    <div class="embed-loading" id="load-${b.id}"></div>
    <iframe
      id="if-${b.id}"
      src="${x(b.url)}"
      title="${x(b.name)}"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-modals" referrerpolicy="no-referrer"
      loading="lazy"
      onload="iframeLoaded('${b.id}')"
      onerror="iframeFailed('${b.id}')">
    </iframe>
    <div class="card-embed-fallback hidden" id="fb-${b.id}">
      <img
        class="fallback-shot"
        src="https://image.thum.io/get/width/1200/${x(b.url)}"
        loading="lazy"
        alt="${x(b.name)} preview">
      <div class="fb-overlay">
        <div class="fb-domain">${h}</div>
        <div class="fb-note">Live preview blocked — using snapshot</div>
      </div>
    </div>

    <div class="card-actions">
      <div class="ca ${b.fav?'fav-on':''}" onclick="toggleFav('${b.id}')" title="${b.fav?'Unfavourite':'Favourite'}">${b.fav?'♥':'♡'}</div>
      <div class="ca" onclick="openModal('${b.id}')" title="Edit">✎</div>
      <div class="ca del" onclick="delBM('${b.id}')" title="Delete">✕</div>
    </div>
  </div>

  <div class="card-foot">
    <div class="foot-fav">
      <img src="https://www.google.com/s2/favicons?domain=${h}&sz=32"
           onerror="this.style.display='none'" loading="lazy">
    </div>
    <span class="foot-name">${x(b.name)}</span>
    ${tags.length ? `<div class="foot-tags">${tagChips}</div>` : ''}
    <a class="foot-ext" href="${x(b.url)}" target="_blank" rel="noopener" title="Open site">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 10.5L10.5 2.5M4.5 2.5h6v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>`;
}

// iframe load handling — show fallback when blocked (X-Frame-Options etc.)
function iframeLoaded(id) {
  const iframe = document.getElementById('if-'+id);
  const loader = document.getElementById('load-'+id);

  if (loader) loader.style.display = 'none';
  if (!iframe) return;

  try {
    void iframe.contentDocument;
  } catch(e) {
    /* cross-origin iframe loaded correctly */
  }
}

function iframeFailed(id) {
  const ifr = document.getElementById('if-'+id);
  const fb  = document.getElementById('fb-'+id);
  const loader = document.getElementById('load-'+id);

  if (loader) loader.style.display = 'none';
  if (ifr) ifr.classList.add('hidden');
  if (fb) fb.classList.remove('hidden');
}

// Many sites block iframes; after a delay check if they're blank and show fallback
function checkIframes() {
  document.querySelectorAll('.card-embed iframe').forEach(ifr => {
    try {
      const doc = ifr.contentDocument || ifr.contentWindow?.document;
      // If we can access it and body is empty → likely blocked with a blank page
      if (doc && (!doc.body || doc.body.innerHTML.trim() === '')) {
        const id = ifr.id.replace('if-','');
        iframeFailed(id);
      }
    } catch(e) { /* cross-origin, loaded fine */ }
  });
}

// ── SIDEBAR ───────────────────────────────────────────────────
function renderSidebar() {
  document.getElementById('cnt-all').textContent = BM.length;
  document.getElementById('cnt-fav').textContent = BM.filter(b=>b.fav).length;
  document.getElementById('cnt-rec').textContent = BM.filter(b=>Date.now()-b.date<864e5*7).length;

  const allTags = allUniqueTags();
  document.getElementById('sb-tags').innerHTML = allTags.map(tag => {
    const matches = BM.filter(b=>(b.tags||[]).map(t=>t.toLowerCase()).includes(tag.toLowerCase()));
    const color   = matches[0]?.color || '#2563eb';
    const on      = S.filter.toLowerCase() === tag.toLowerCase();
    return `<div class="sb-item ${on?'on':''}" onclick="setFilter('${tag}',this)">
      <span class="sb-lbl"><span class="tag-dot" style="background:${color}"></span>${x(tag)}</span>
      <span class="sb-n">${matches.length}</span>
    </div>`;
  }).join('');

  document.getElementById('tag-dl').innerHTML = allTags.map(t=>`<option value="${x(t)}">`).join('');
}

function allUniqueTags() {
  const seen = new Set();
  BM.forEach(b => (b.tags||[]).forEach(t => seen.add(t)));
  return [...seen].sort();
}

// ── PILLS ─────────────────────────────────────────────────────
function renderPills() {
  const tags = allUniqueTags();
  const base = [{l:'All',v:'all'},{l:'♥ Favourites',v:'fav'}];
  const all  = [...base, ...tags.map(t=>({l:t,v:t}))];
  document.getElementById('pills').innerHTML = all.map(p =>
    `<div class="pill ${S.filter===p.v?'on':''}" onclick="setFilter('${p.v}',null)">${x(p.l)}</div>`
  ).join('');
}

// ── CONTROLS ──────────────────────────────────────────────────
function setFilter(f, el) {
  S.filter = f;
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('on'));
  if (el) el.classList.add('on');
  render();
}

// ── MODAL + MULTI-TAG INPUT ───────────────────────────────────
let modalTags = [];

function openModal(id=null) {
  S.editId = id;
  modalTags = [];
  document.getElementById('m-title').textContent = id ? 'Edit bookmark' : 'Add bookmark';
  if (id) {
    const b = BM.find(b=>b.id===id);
    document.getElementById('f-url').value  = b.url;
    document.getElementById('f-name').value = b.name;
    modalTags = [...(b.tags||[])];
    S.color = b.color;
  } else {
    document.getElementById('f-url').value  = '';
    document.getElementById('f-name').value = '';
    S.color = COLORS[0];
  }
  renderTagTokens();
  updateColors();
  document.getElementById('m-ov').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-url').focus(), 80);
}

function closeModal() {
  document.getElementById('m-ov').classList.add('hidden');
  S.editId = null; modalTags = [];
}

function renderTagTokens() {
  const wrap = document.getElementById('tag-wrap');
  // remove old tokens
  wrap.querySelectorAll('.tag-token').forEach(el=>el.remove());
  // insert tokens before the input
  const input = document.getElementById('tag-bare');
  modalTags.forEach((t,i) => {
    const el = document.createElement('span');
    el.className = 'tag-token';
    el.innerHTML = `${x(t)}<button onclick="removeTag(${i})" type="button">✕</button>`;
    wrap.insertBefore(el, input);
  });
  input.value = '';
  input.placeholder = modalTags.length ? '' : "e.g. typography, grids…";
}

function handleTagKey(e) {
  const val = e.target.value.trim();
  if ((e.key === 'Enter' || e.key === ',') && val) {
    e.preventDefault();
    addTag(val.replace(/,$/,'').trim());
  } else if (e.key === 'Backspace' && !e.target.value && modalTags.length) {
    removeTag(modalTags.length-1);
  }
}

function addTag(t) {
  t = t.trim().toLowerCase();
  if (!t || modalTags.map(x=>x.toLowerCase()).includes(t)) return;
  modalTags.push(t);
  renderTagTokens();
}

function removeTag(i) { modalTags.splice(i,1); renderTagTokens(); }

function saveBM() {
  // flush any pending text in the tag input
  const bare = document.getElementById('tag-bare').value.trim().replace(/,$/,'').trim();
  if (bare) addTag(bare);

  let url = document.getElementById('f-url').value.trim();
  if (!url) { toast('Please enter a URL'); return; }
  if (!url.startsWith('http')) url = 'https://'+url;
  const name = document.getElementById('f-name').value.trim() || host(url);
  const tags = [...modalTags];

  if (S.editId) {
    const idx = BM.findIndex(b=>b.id===S.editId);
    BM[idx] = { ...BM[idx], url, name, tags, color:S.color };
    toast('Bookmark updated');
  } else {
    BM.unshift({ id:uid(), url, name, tags, color:S.color, fav:false, date:Date.now() });
    toast('Bookmark saved');
  }
  persist(); closeModal(); render();
}

function hintName() {
  const url = document.getElementById('f-url').value.trim();
  const n   = document.getElementById('f-name');
  if (url && !n.value) n.placeholder = host(url.startsWith('http') ? url : 'https://'+url);
}

// ── ACTIONS ───────────────────────────────────────────────────
function toggleFav(id) { const b=BM.find(b=>b.id===id); if(b){b.fav=!b.fav;persist();render();} }
function delBM(id) {
  if (!confirm('Delete this bookmark?')) return;
  BM = BM.filter(b=>b.id!==id); persist(); render(); toast('Deleted');
}

// ── COLORS ────────────────────────────────────────────────────
function buildColors() {
  document.getElementById('c-row').innerHTML = COLORS.map(c =>
    `<div class="c-chip" style="background:${c}" onclick="S.color='${c}';updateColors()" title="${c}"></div>`
  ).join('');
  updateColors();
}
function updateColors() {
  document.querySelectorAll('.c-chip').forEach(el=>{
    el.classList.toggle('on', toHex(el.style.background)===S.color || el.style.background===S.color);
  });
}
function toHex(rgb) {
  const m=rgb.match(/\d+/g); if(!m) return rgb;
  return '#'+m.slice(0,3).map(v=>parseInt(v).toString(16).padStart(2,'0')).join('');
}

// ── UTILS ─────────────────────────────────────────────────────
function uid()   { return Math.random().toString(36).slice(2,10); }
function host(u) { try{return new URL(u).hostname.replace('www.','')}catch{return u;} }
function x(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tint(hex) {
  try {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},.08)`;
  } catch { return '#f0efec'; }
}

let _tt;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); clearTimeout(_tt); _tt=setTimeout(()=>el.remove(),2500);
}

// ── KEYBOARD ──────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') closeModal();
  if (e.key==='n' && e.target===document.body) openModal();
  if (e.key==='/' && e.target===document.body){ e.preventDefault(); document.getElementById('q').focus(); }
});

// Run iframe blank-page check after load
window.addEventListener('load', ()=>{ setTimeout(checkIframes, 3000); });

// ── IFRAME SCALING ────────────────────────────────────────────
// Scale each iframe so it exactly fills its .card-embed container.
// The iframe is always rendered at IFRAME_W × IFRAME_H (desktop viewport),
// so scale = containerWidth / IFRAME_W.  The container height is already
// set by the 56.25% padding-top (16:9), so the scaled iframe fills it perfectly.
const IFRAME_W = 1440;
const IFRAME_H = 900;

function scaleIframes() {
  document.querySelectorAll('.card-embed').forEach(embed => {
    const ifr = embed.querySelector('iframe');
    if (!ifr) return;
    const containerW = embed.offsetWidth;
    const scale = containerW / IFRAME_W;
    ifr.style.transform = `scale(${scale})`;
  });
}

// Re-scale whenever the layout changes
const _ro = new ResizeObserver(scaleIframes);
_ro.observe(document.querySelector('.shell') || document.body);
window.addEventListener('resize', scaleIframes);

init();
</script>
